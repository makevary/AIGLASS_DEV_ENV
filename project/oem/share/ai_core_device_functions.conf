# ai-core device function metadata
# This file will be packed to /usr/share/ai_core_device_functions.conf

[device_function]
name=enter_realtime_stream_mode
display_name=视频流
action_name=打开
script_path=/oem/usr/bin/rkipc_device_enter.sh
timeout_ms=30000
trigger_intents=打开监控|开始实时画面|进入串流模式|让我远程看现场|开启摄像头直播|打开实时视频
misfire_constraints=不要把拍照、看一下前面、识别当前画面、帮我看看这个东西，这类一次性视觉请求误判成进入实时串流。

[device_function]
name=exit_realtime_stream_mode
display_name=视频流
action_name=关闭
script_path=/oem/usr/bin/rkipc_device_exit_to_aicore.sh
timeout_ms=30000
trigger_intents=关闭监控|停止串流|退出实时画面|关闭实时视频|把设备切回默认状态|退出监控模式
misfire_constraints=不要把结束一次拍照、停止一次识别、关闭单次预览，这类短时操作误判成退出实时串流。
